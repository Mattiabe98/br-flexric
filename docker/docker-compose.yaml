services:
    mysql:
        container_name: "mysql"
        image: mysql:8.0
        volumes:
            - ./oai_db.sql:/docker-entrypoint-initdb.d/oai_db.sql
            - ./mysql-healthcheck.sh:/tmp/mysql-healthcheck.sh
        environment:
            - TZ=Europe/Paris
            - MYSQL_DATABASE=oai_db
            - MYSQL_USER=test
            - MYSQL_PASSWORD=test
            - MYSQL_ROOT_PASSWORD=linux
        healthcheck:
            test: /bin/bash -c "/tmp/mysql-healthcheck.sh"
            interval: 10s
            timeout: 5s
            retries: 30
        networks:
            core_net:
                ipv4_address: 192.168.71.131
    oai-flexric:
        image: oai-flexric:grafana
        command: "stdbuf -o0 nearRT-RIC"
        container_name: oai-flexric
        networks:
            f1c_net:
                ipv4_address: 192.168.72.150
        volumes:
            - ./flexric.conf:/usr/local/etc/flexric/flexric.conf
    oai-xapp-kpm-moni:
        image: oai-flexric:grafana
        command: "stdbuf -o0 /usr/local/flexric/xApp/c/monitor/xapp_kpm_moni"
        container_name: xapp-kpm-moni
        networks:
            f1c_net:
                ipv4_address: 192.168.72.153
        volumes:
            - ./flexric.conf:/usr/local/etc/flexric/flexric.conf
            - flexric:/flexric
    oai-amf:
        container_name: "oai-amf"
        image: oaisoftwarealliance/oai-amf:v2.0.0
        environment:
            - TZ=Europe/paris
        volumes:
            - ./mini_nonrf_config_3slices.yaml:/openair-amf/etc/config.yaml
        depends_on:
            - mysql
        networks:
            core_net:
                ipv4_address: 192.168.71.132
    oai-smf:
        container_name: "oai-smf"
        image: oaisoftwarealliance/oai-smf:v2.0.0
        environment:
            - TZ=Europe/Paris
        volumes:
            - ./mini_nonrf_config_3slices.yaml:/openair-smf/etc/config.yaml
        depends_on:
            - oai-amf
        networks:
            core_net:
                ipv4_address: 192.168.71.133
    oai-upf:
        container_name: "oai-upf"
        image: oaisoftwarealliance/oai-upf:v2.0.0
        environment:
            - TZ=Europe/Paris
        volumes:
            - ./mini_nonrf_config_3slices.yaml:/openair-upf/etc/config.yaml
        depends_on:
            - oai-smf
        cap_add:
            - NET_ADMIN
            - SYS_ADMIN
        cap_drop:
            - ALL
        privileged: true
        networks:
            core_net:
                ipv4_address: 192.168.71.134
            traffic_net:
                ipv4_address: 192.168.79.134
    oai-ext-dn:
        privileged: true
        container_name: oai-ext-dn
        image: oaisoftwarealliance/trf-gen-cn5g:focal
        entrypoint: /bin/bash -c \
              "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE;"\
              "ip route add 12.1.1.0/24 via 192.168.79.134 dev eth0; sleep infinity"
        depends_on:
            - oai-upf
        networks:
            traffic_net:
                ipv4_address: 192.168.79.135
        healthcheck:
            test: /bin/bash -c "ping -c 2 192.168.79.134"
            interval: 10s
            timeout: 5s
            retries: 5

    oai-cucp:
        image: oaisoftwarealliance/oai-gnb:2024.w30
        privileged: true
        container_name: oai-cucp
        environment:
            USE_ADDITIONAL_OPTIONS: --sa --log_config.global_log_options level,nocolor,time
                                    --gNBs.[0].E1_INTERFACE.[0].ipv4_cucp 192.168.77.2
                                    --gNBs.[0].local_s_address 192.168.72.2
            ASAN_OPTIONS: detect_leaks=0
            OAI_GDBSTACKS: 1
        depends_on:
            - oai-upf
        networks:
            core_net:
                ipv4_address: 192.168.71.150
            f1c_net:
                ipv4_address: 192.168.72.2
            e1_net:
                ipv4_address: 192.168.77.2
        volumes:
            - ./gnb-cucp.sa.f1.conf:/opt/oai-gnb/etc/gnb.conf
            - ./service_models/:/usr/local/lib/flexric/
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            interval: 10s
            timeout: 5s
            retries: 5
    oai-cuup:
        image: oaisoftwarealliance/oai-nr-cuup:2024.w30
        privileged: true
        container_name: oai-cuup
        environment:
            USE_ADDITIONAL_OPTIONS: --sa --log_config.global_log_options level,nocolor,time
                                    --gNBs.[0].E1_INTERFACE.[0].ipv4_cucp 192.168.77.2
                                    --gNBs.[0].E1_INTERFACE.[0].ipv4_cuup 192.168.77.3
                                    --gNBs.[0].local_s_address 192.168.73.2
                                    --gNBs.[0].remote_s_address 127.0.0.1
            ASAN_OPTIONS: detect_leaks=0
            OAI_GDBSTACKS: 1
        depends_on:
            - oai-cucp
        networks:
            core_net:
                ipv4_address: 192.168.71.161
            f1c_net:
                ipv4_address: 192.168.72.12
            f1u_1_net:
                ipv4_address: 192.168.73.2
            e1_net:
                ipv4_address: 192.168.77.3
        volumes:
            - ./gnb-cuup.sa.f1.conf:/opt/oai-gnb/etc/gnb.conf
            - ./service_models/:/usr/local/lib/flexric/
        healthcheck:
            test: /bin/bash -c "pgrep nr-cuup"
            interval: 10s
            timeout: 5s
            retries: 5
    oai-du:
        image: oaisoftwarealliance/oai-gnb:2024.w30
        privileged: true
        container_name: oai-du
        environment:
            USE_ADDITIONAL_OPTIONS: --sa --rfsim --log_config.global_log_options level,nocolor,time
                                    --MACRLCs.[0].local_n_address 192.168.72.3
                                    --MACRLCs.[0].remote_n_address 192.168.72.2
            ASAN_OPTIONS: detect_leaks=0
            OAI_GDBSTACKS: 1
        depends_on:
            - oai-cucp
            - oai-cuup
        networks:
            f1c_net:
                ipv4_address: 192.168.72.3
            f1u_1_net:
                ipv4_address: 192.168.73.3
            ue_net:
                ipv4_address: 192.168.78.2
        volumes:
            - ./gnb-du.sa.band78.106prb.rfsim.conf:/opt/oai-gnb/etc/gnb.conf
            - ./service_models/:/usr/local/lib/flexric/
        healthcheck:
           test: /bin/bash -c "pgrep nr-softmodem"
           interval: 10s
           timeout: 5s
           retries: 5
    oai-nr-ue1:
        image: oaisoftwarealliance/oai-nr-ue:2024.w30
        privileged: true
        container_name: oai-nr-ue1
        environment:
            USE_ADDITIONAL_OPTIONS: --sa --rfsim --log_config.global_log_options level,nocolor,time
                                    -r 106 --numerology 1 -C 3619200000
                                    --uicc0.imsi 208990100001100
                                    --rfsimulator.serveraddr 192.168.78.2
            OAI_GDBSTACKS: 1
        depends_on:
           - oai-du
        networks:
            ue_net:
                ipv4_address: 192.168.78.5
        volumes:
            - ./nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5
    oai-nr-ue2:
        image: oaisoftwarealliance/oai-nr-ue:2024.w30
        privileged: true
        container_name: oai-nr-ue2
        environment:
            USE_ADDITIONAL_OPTIONS: --sa --rfsim --log_config.global_log_options level,nocolor,time
                                    -r 106 --numerology 1 -C 3619200000
                                    --uicc0.imsi 208990100001101
                                    --rfsimulator.serveraddr 192.168.78.2
            OAI_GDBSTACKS: 1
        depends_on:
           - oai-du
        networks:
            ue_net:
                ipv4_address: 192.168.78.6
        volumes:
            - ./nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5
    grafana:
        image: grafana/grafana-oss:latest
        container_name: grafana
        environment:
            - TZ=Europe/Paris
            - GF_INSTALL_PLUGINS=frser-sqlite-datasource
        volumes:
            - ./datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
            - ./dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
            - ./dashboards/grafana-dashboard.json:/var/lib/grafana/dashboards/dashboard.json
            - flexric:/var/lib/grafana/
        networks:
            core_net:
                ipv4_address: 192.168.71.140
        ports:
            - "3000:3000"
networks:
    core_net:
        driver: bridge
        name: oai-core-net
        ipam:
            config:
                - subnet: 192.168.71.128/26
        driver_opts:
            com.docker.network.bridge.name: "core"
    traffic_net:
        driver: bridge
        name: oai-traffic-net
        ipam:
            config:
                - subnet: 192.168.79.128/26
        driver_opts:
            com.docker.network.bridge.name: "traffic"
    f1c_net:
        driver: bridge
        name: oai-f1c-net
        ipam:
            config:
                - subnet: 192.168.72.0/24
        driver_opts:
            com.docker.network.bridge.name: "f1c"
    f1u_1_net:
        driver: bridge
        name: oai-f1u-1-net
        ipam:
            config:
                - subnet: 192.168.73.0/28
        driver_opts:
            com.docker.network.bridge.name: "f1u_1"
    e1_net:
        driver: bridge
        name: oai-e1-net
        ipam:
            config:
                - subnet: 192.168.77.0/28
        driver_opts:
            com.docker.network.bridge.name: "e1"
    ue_net:
        driver: bridge
        name: oai-ue-net
        ipam:
            config:
                - subnet: 192.168.78.0/28
        driver_opts:
            com.docker.network.bridge.name: "ue"

volumes:
  flexric:
